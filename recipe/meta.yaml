{% set name = "Chameleon" %}
{% set version = "4.6.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0]|lower }}/{{ name|lower }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: c1775d54907966c8e397a1292b1a2755d254b7f070d0719ac9e579d9ab81e5b5

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<311]

requirements:
  host:
    - pip
    - python
    - setuptools >=42
    - wheel
  run:
    - python
    - importlib-metadata  # [py<310]

test:
  imports:
    - chameleon
    - chameleon.tests
    - chameleon.utils
    - chameleon.zpt
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv --pyargs chameleon.tests
  requires:
    - pip
    - pytest
    - setuptools  # test_loader builds sample egg/wheel packages with setuptools.setup

about:
  home: https://chameleon.readthedocs.io
  license: BSD-4-Clause AND ZPL-2.1 AND PSF-2.0
  license_family: Other
  license_file: LICENSE.txt
  summary: HTML/XML template engine for Python
  description: |
    Chameleon is an HTML/XML template engine for Python designed to generate
    the document output of a web application, typically HTML markup or XML.
  doc_url: https://chameleon.readthedocs.io
  dev_url: https://github.com/malthe/chameleon

extra:
  recipe-maintainers:
    - nehaljwani
